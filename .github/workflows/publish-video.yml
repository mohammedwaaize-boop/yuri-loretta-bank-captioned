name: Publish younger Loretta film
on:
  push:
    paths:
      - '.github/workflows/publish-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify captioned film
        run: |
          curl --fail --location --retry 3 --output YURI_Loretta_Young_Glow_Captioned_480p.mp4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/6204b84b-0866-404e-9c7f-3b1f6c3041e0.mp4'
          echo '55c307651130192b031ef616cb74a3d466083e05320ae4f878ec4d83614ca483  YURI_Loretta_Young_Glow_Captioned_480p.mp4' | sha256sum --check
      - name: Publish direct MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Complete bank drama with younger Loretta and smoother skin. Preserves the approved frontal speaker close-ups, reverse angles, original dialogue and captions.

          Duration: 4:08. Original resolution: 480 x 854, 24 fps.
          File size: 59092327 bytes.
          One complete MP4. Download directly; no extraction required.

          SHA-256: 55c307651130192b031ef616cb74a3d466083e05320ae4f878ec4d83614ca483
          NOTES
          gh release create v4.0 YURI_Loretta_Young_Glow_Captioned_480p.mp4 --title 'YURI Loretta — Younger look' --notes-file release-notes.md
          gh release view v4.0 --json url,assets
