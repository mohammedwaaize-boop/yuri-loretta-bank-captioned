name: Publish direct MP4 download
on:
  push:
    paths:
      - '.github/workflows/publish-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify original captioned MP4
        run: |
          curl --fail --location --retry 3 --output YURI_Loretta_Full_Quality_Captioned.mp4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/e6d54082-d9e5-4a26-9abd-6e44819910cb.mp4'
          echo 'a4e327701203d07dbbffca1959d3bd82f4893989792cb9bc8e42576b6bbf658e  YURI_Loretta_Full_Quality_Captioned.mp4' | sha256sum --check
      - name: Publish single original MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v1.0 YURI_Loretta_Full_Quality_Captioned.mp4
          gh release view v1.0 --json url,assets
