name: Publish frontal conversation film
on:
  push:
    paths:
      - '.github/workflows/publish-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify captioned film
        run: |
          curl --fail --location --retry 3 --output YURI_Loretta_Frontal_Captioned_480p.mp4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/6ff7e85b-108e-4e6b-bc95-3c2dce5751d7.mp4'
          echo 'bb968ca0141a2e46a15d98b95f6328b9601ebd1e36f2a19f8a913e7954956ea0  YURI_Loretta_Frontal_Captioned_480p.mp4' | sha256sum --check
      - name: Publish direct MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Complete regenerated bank drama with frontal speaker close-ups, reverse angles, matching conversation eyelines, and burned-in captions.

          Duration: 4:08. Original resolution: 480 × 854, 24 fps.
          File size: 56076887 bytes.
          One complete MP4. Download directly; no extraction required.

          SHA-256: bb968ca0141a2e46a15d98b95f6328b9601ebd1e36f2a19f8a913e7954956ea0
          NOTES
          gh release create v3.0 YURI_Loretta_Frontal_Captioned_480p.mp4 --title 'YURI Loretta — Frontal conversation remake' --notes-file release-notes.md
          gh release view v3.0 --json url,assets
