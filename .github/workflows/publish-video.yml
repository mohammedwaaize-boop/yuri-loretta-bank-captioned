name: Publish clean film with corrected clerk
on:
  push:
    paths:
      - '.github/workflows/publish-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify no-captions MP4
        run: |
          curl --fail --location --retry 3 --output YURI_Loretta_No_Captions_LipSync_480p.mp4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/53af5620-d47a-4f68-a0a7-3e099dee92d9.mp4'
          echo '7d0001258f235c6cbaeedb7a3af49b574f1e3ca77a6847c4e1b1f871a7ec2b61  YURI_Loretta_No_Captions_LipSync_480p.mp4' | sha256sum --check
      - name: Publish direct MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          All dialogue captions removed by rendering clean source clips. The walking cutaway around0:31-0:36 is replaced with Megan visibly speaking her own lines. Her mouth timing is aligned to the original dialogue audio. Preserves the approved younger Loretta, seated continuity and product end-card artwork.

          Duration: 4:08. Native resolution: 480 x 854, 24 fps.
          File size: 57567442 bytes.
          One complete MP4 without dialogue captions. No extraction required.

          SHA-256: 7d0001258f235c6cbaeedb7a3af49b574f1e3ca77a6847c4e1b1f871a7ec2b61
          NOTES
          gh release create v6.0 YURI_Loretta_No_Captions_LipSync_480p.mp4 --title 'YURI Loretta — No captions, corrected clerk' --notes-file release-notes.md
          gh release view v6.0 --json url,assets
